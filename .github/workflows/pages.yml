# Builds the web app and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://holehuy.github.io/open-gym/ (Settings → Pages → Deploy from a branch: gh-pages, /).
# scripts/deploy-pages.sh does the same thing from a local machine, so either way works.
#
# Pages serves static files only, so there is no backend: the app runs in guest mode and keeps
# its data in the browser. VITE_STATIC=1 boots straight into guest mode and hides passkey and
# profile sign-in, which would only fail here (405). Unlike the upstream demo it does NOT set
# VITE_DEMO, so it starts empty. Vite's base is './', so the build works under /open-gym/.
# The 180 px exercise stills and animations from catalogue/media are staged next to the build
# by scripts/catalogue/stage-media.mjs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages
  pages: write      # request the Pages build

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC: '1'
      - run: node scripts/catalogue/stage-media.mjs frontend/dist && touch frontend/dist/.nojekyll

      - name: Push to gh-pages
        working-directory: frontend/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::9} to GitHub Pages (workflow)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # A push made with the workflow token may not start a Pages build on its own; ask for one.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
